<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Interview Quiz - Complete System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Module Selection Screen */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.6s;
        }

        .module-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .module-card:hover::before {
            left: 100%;
        }

        .module-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .module-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .module-description {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .module-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .module-progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .module-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .start-module-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-module-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        /* Quiz Interface */
        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .quiz-title {
            font-size: 1.5rem;
            color: #333;
            font-weight: bold;
        }

        .quiz-meta {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 25px;
            height: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 25px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }

        .question-slide {
            display: none;
            animation: slideInRight 0.5s ease-out;
        }

        .question-slide.active {
            display: block;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            color: white;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .difficulty-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .options {
            list-style: none;
            margin-bottom: 30px;
        }

        .option {
            margin-bottom: 12px;
            padding: 18px 25px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .option:hover::before {
            left: 100%;
        }

        .option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: scale(1.02);
        }

        .option.correct {
            border-color: #28a745;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
        }

        .explanation {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            border-radius: 15px;
            border-left: 5px solid #2196f3;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .explanation p {
            color: #555;
            line-height: 1.6;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Screen */
        .results-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            display: none;
            text-align: center;
        }

        .final-score {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .score-excellent { color: #28a745; }
        .score-good { color: #17a2b8; }
        .score-average { color: #ffc107; }
        .score-poor { color: #dc3545; }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .result-card {
            background: linear-gradient(135deg, #fff, #f8f9fa);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
        }

        .result-card h3 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .performance-message {
            font-size: 1.2rem;
            margin: 30px 0;
            padding: 20px;
            border-radius: 15px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(40, 167, 69, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }
            
            .quiz-container, .results-container {
                margin: 10px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .navigation {
                flex-direction: column;
                gap: 15px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Main Header -->
        <div class="header">
            <h1>🤖 Android Interview Quiz</h1>
            <p>Hệ thống học tập Android Development toàn diện</p>
        </div>

        <!-- Modules Selection Screen -->
        <div id="modulesScreen">
            <div class="modules-grid" id="modulesGrid">
                <!-- Modules will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div class="quiz-container" id="quizScreen">
            <div class="quiz-header">
                <div class="quiz-title" id="quizTitle">Module Quiz</div>
                <div class="quiz-meta">
                    <button class="back-btn" onclick="backToModules()">← Quay lại</button>
                    <div id="currentScore" style="font-weight: bold; color: #667eea;"></div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Câu 1/20</div>
            </div>

            <div id="questionContainer">
                <!-- Questions will be inserted here -->
            </div>

            <div class="navigation">
                <button class="nav-btn" id="prevBtn" onclick="previousQuestion()" disabled>← Câu trước</button>
                <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp →</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-container" id="resultsScreen">
            <h2>🎉 Kết quả Quiz</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="results-summary" id="resultsSummary"></div>
            <div class="performance-message" id="performanceMessage"></div>
            <div>
                <button class="restart-btn" onclick="retryModule()">🔄 Làm lại module</button>
                <button class="restart-btn" onclick="backToModules()">📚 Chọn module khác</button>
            </div>
        </div>
    </div>

    <script>
        // Module definitions based on repository content
        const modules = {
            kotlin: {
                id: 'kotlin',
                title: 'Kotlin Fundamentals',
                icon: '🎯',
                description: 'Kotlin basics, Coroutines, Flow API, OOP concepts, functions và advanced features',
                questionCount: 45,
                difficulty: 'Beginner to Advanced',
                estimatedTime: '60 phút'
            },
            androidCore: {
                id: 'androidCore',
                title: 'Android Core Components',
                icon: '📱',
                description: 'Activity, Fragment, Intent, BroadcastReceiver, Service lifecycle và best practices',
                questionCount: 40,
                difficulty: 'Intermediate',
                estimatedTime: '50 phút'
            },
            androidUI: {
                id: 'androidUI',
                title: 'Android UI & Views',
                icon: '🎨',
                description: 'RecyclerView, ViewPager, Custom Views, Layouts, Animations và UI optimization',
                questionCount: 35,
                difficulty: 'Intermediate',
                estimatedTime: '45 phút'
            },
            architecture: {
                id: 'architecture',
                title: 'Android Architecture',
                icon: '🏗️',
                description: 'MVVM, MVP, Clean Architecture, ViewModel, LiveData, Repository pattern',
                questionCount: 30,
                difficulty: 'Advanced',
                estimatedTime: '40 phút'
            },
            dataStorage: {
                id: 'dataStorage',
                title: 'Data & Storage',
                icon: '💾',
                description: 'Room Database, SharedPreferences, SQLite, File storage và data persistence',
                questionCount: 25,
                difficulty: 'Intermediate',
                estimatedTime: '35 phút'
            },
            networking: {
                id: 'networking',
                title: 'Networking & APIs',
                icon: '🌐',
                description: 'Retrofit, OkHttp, REST APIs, GraphQL, caching và error handling',
                questionCount: 30,
                difficulty: 'Intermediate',
                estimatedTime: '40 phút'
            },
            performance: {
                id: 'performance',
                title: 'Performance & Memory',
                icon: '⚡',
                description: 'Memory management, ANR, battery optimization, profiling và best practices',
                questionCount: 25,
                difficulty: 'Advanced',
                estimatedTime: '35 phút'
            },
            threading: {
                id: 'threading',
                title: 'Threading & Concurrency',
                icon: '🔄',
                description: 'Threads, Handler, Looper, AsyncTask, ExecutorService và background processing',
                questionCount: 25,
                difficulty: 'Advanced',
                estimatedTime: '35 phút'
            },
            services: {
                id: 'services',
                title: 'Services & Background',
                icon: '⚙️',
                description: 'Service types, WorkManager, JobScheduler, Foreground services và background tasks',
                questionCount: 20,
                difficulty: 'Intermediate',
                estimatedTime: '30 phút'
            },
            testing: {
                id: 'testing',
                title: 'Testing & Debugging',
                icon: '🧪',
                description: 'Unit testing, UI testing, Mockito, Espresso, debugging tools và best practices',
                questionCount: 20,
                difficulty: 'Advanced',
                estimatedTime: '30 phút'
            },
            libraries: {
                id: 'libraries',
                title: 'Popular Libraries',
                icon: '📚',
                description: 'Dagger/Hilt, RxJava, Glide, Retrofit advanced, popular Android libraries',
                questionCount: 25,
                difficulty: 'Advanced',
                estimatedTime: '35 phút'
            },
            buildSystem: {
                id: 'buildSystem',
                title: 'Build System & Tools',
                icon: '🔨',
                description: 'Gradle, ProGuard, R8, build variants, CI/CD, signing và deployment',
                questionCount: 20,
                difficulty: 'Intermediate',
                estimatedTime: '30 phút'
            },
            security: {
                id: 'security',
                title: 'Security & Permissions',
                icon: '🔐',
                description: 'Runtime permissions, security best practices, encryption, obfuscation',
                questionCount: 15,
                difficulty: 'Advanced',
                estimatedTime: '25 phút'
            },
            jetpackCompose: {
                id: 'jetpackCompose',
                title: 'Jetpack Compose',
                icon: '🚀',
                description: 'Modern UI toolkit, declarative UI, state management, navigation trong Compose',
                questionCount: 25,
                difficulty: 'Advanced',
                estimatedTime: '35 phút'
            },
            systemDesign: {
                id: 'systemDesign',
                title: 'System Design',
                icon: '🏛️',
                description: 'Mobile system design, scalability, offline-first, real-time features',
                questionCount: 20,
                difficulty: 'Expert',
                estimatedTime: '30 phút'
            }
        };

        // Quiz questions organized by modules
        const questionBank = {
            kotlin: [
                {
                    question: "Kotlin Coroutines là gì và tại sao nó hữu ích trong Android development?",
                    options: [
                        "Một thư viện để xử lý UI animations",
                        "Một cách để viết asynchronous code một cách tuần tự và dễ đọc",
                        "Một design pattern cho Android architecture",
                        "Một tool để debug Android applications"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Kotlin Coroutines là concurrency design pattern giúp simplify asynchronous programming. Nó cho phép viết asynchronous code theo cách sequential, making it easier to read và maintain."
                },
                {
                    question: "Sự khác biệt giữa 'launch' và 'async' trong Kotlin Coroutines là gì?",
                    options: [
                        "Không có sự khác biệt nào",
                        "launch trả về Job, async trả về Deferred và có thể return value",
                        "async nhanh hơn launch",
                        "launch chỉ dành cho UI operations"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "launch được sử dụng cho fire-and-forget operations và trả về Job. async được sử dụng khi bạn cần return value và trả về Deferred<T> mà bạn có thể await()."
                },
                {
                    question: "lateinit và lazy trong Kotlin khác nhau như thế nào?",
                    options: [
                        "Không có sự khác biệt",
                        "lateinit cho var, lazy cho val và khởi tạo khi được truy cập lần đầu",
                        "lazy nhanh hơn lateinit",
                        "lateinit chỉ dùng cho primitive types"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "lateinit modifier dùng với var properties và phải được khởi tạo trước khi sử dụng. lazy delegate dùng với val properties và được khởi tạo lazily khi được access lần đầu tiên."
                },
                {
                    question: "Companion object trong Kotlin tương đương với gì trong Java?",
                    options: [
                        "Instance methods",
                        "Static methods và fields",
                        "Interface default methods",
                        "Abstract methods"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Companion object trong Kotlin tương đương với static members trong Java. Members của companion object có thể được access thông qua class name mà không cần tạo instance."
                },
                {
                    question: "Extension functions trong Kotlin có ưu điểm gì?",
                    options: [
                        "Giúp tăng performance",
                        "Cho phép thêm functionality vào existing class mà không cần inheritance",
                        "Chỉ dùng để làm code đẹp hơn",
                        "Thay thế hoàn toàn inheritance"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Extension functions cho phép extend class với new functionality mà không cần modify class đó hay inherit từ nó. Chúng được resolve statically."
                },
                // Add more Kotlin questions here (up to 45 total)
                {
                    question: "inline function trong Kotlin được sử dụng để làm gì?",
                    options: [
                        "Để function chạy nhanh hơn",
                        "Compiler sẽ copy function body vào call site để avoid function call overhead",
                        "Để function có thể được call từ Java",
                        "Để function không thể được override"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "inline functions có function body được copy vào call site bởi compiler, giúp eliminate function call overhead. Đặc biệt hữu ích cho higher-order functions."
                },
                {
                    question: "reified keyword trong Kotlin được sử dụng khi nào?",
                    options: [
                        "Với tất cả generic functions",
                        "Với inline functions để preserve type information at runtime",
                        "Để tạo singleton objects",
                        "Với data classes"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "reified keyword chỉ có thể dùng với inline functions và generic type parameters. Nó preserve type information at runtime, cho phép access type T trong function body."
                },
                {
                    question: "Sealed classes trong Kotlin có đặc điểm gì?",
                    options: [
                        "Có thể được inherit từ bất kỳ đâu",
                        "Restrict inheritance và all subclasses phải declare trong cùng file",
                        "Không thể có subclasses",
                        "Chỉ có thể có abstract methods"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Sealed classes restrict inheritance hierarchy. Tất cả direct subclasses phải declare trong same file. Hữu ích cho representing restricted class hierarchies."
                },
                {
                    question: "Scope functions trong Kotlin (let, run, with, apply, also) khác nhau như thế nào?",
                    options: [
                        "Chỉ khác về naming",
                        "Khác về context object (this vs it) và return value",
                        "Khác về performance",
                        "Không có sự khác biệt thực tế"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "Scope functions khác nhau về cách refer đến context object (this vs it) và return value (context object vs lambda result). let/also dùng 'it', run/with/apply dùng 'this'."
                },
                {
                    question: "Data classes trong Kotlin tự động generate những gì?",
                    options: [
                        "Chỉ có constructor",
                        "equals(), hashCode(), toString(), copy(), componentN() functions",
                        "Chỉ có getter và setter",
                        "Chỉ có toString()"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Data classes tự động generate equals(), hashCode(), toString(), copy() function và componentN() functions for destructuring based on properties defined in primary constructor."
                }
            ],

        // Initialize module progress from localStorage
        function initializeModuleProgress() {
            const progress = JSON.parse(localStorage.getItem('moduleProgress') || '{}');
            Object.keys(modules).forEach(moduleId => {
                if (!progress[moduleId]) {
                    progress[moduleId] = {
                        completed: false,
                        score: 0,
                        attempts: 0,
                        bestScore: 0
                    };
                }
            });
            localStorage.setItem('moduleProgress', JSON.stringify(progress));
            return progress;
        }

        // Current quiz state
        let currentModule = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let answers = [];
        let moduleProgress = initializeModuleProgress();

        // Render modules grid
        function renderModules() {
            const grid = document.getElementById('modulesGrid');
            
            grid.innerHTML = Object.values(modules).map(module => {
                const progress = moduleProgress[module.id];
                const progressPercent = progress.completed ? 100 : (progress.attempts > 0 ? 50 : 0);
                
                return `
                    <div class="module-card" onclick="startModule('${module.id}')">
                        <div class="module-icon">${module.icon}</div>
                        <div class="module-title">${module.title}</div>
                        <div class="module-description">${module.description}</div>
                        
                        <div class="module-stats">
                            <div class="stat-item">
                                <div class="stat-number">${module.questionCount}</div>
                                <div class="stat-label">Câu hỏi</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${module.difficulty}</div>
                                <div class="stat-label">Độ khó</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${module.estimatedTime}</div>
                                <div class="stat-label">Thời gian</div>
                            </div>
                        </div>
                        
                        <div class="module-progress">
                            <div class="module-progress-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <span style="font-size: 0.9rem; color: #666;">
                                ${progress.attempts > 0 ? `Điểm cao nhất: ${progress.bestScore}%` : 'Chưa thử'}
                            </span>
                            <span style="font-size: 0.9rem; color: #667eea; font-weight: bold;">
                                ${progress.completed ? '✅ Hoàn thành' : progress.attempts > 0 ? '🔄 Đang làm' : '🆕 Mới'}
                            </span>
                        </div>
                        
                        <button class="start-module-btn">
                            ${progress.attempts > 0 ? '🔄 Làm lại' : '🚀 Bắt đầu'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Start a specific module
        function startModule(moduleId) {
            currentModule = modules[moduleId];
            currentQuestions = questionBank[moduleId] || [];
            
            if (currentQuestions.length === 0) {
                alert('Module này đang được phát triển. Vui lòng chọn module khác!');
                return;
            }
            
            // Shuffle questions for variety
            currentQuestions = shuffleArray([...currentQuestions]);
            
            currentQuestionIndex = 0;
            answers = [];
            
            document.getElementById('modulesScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            document.getElementById('quizTitle').textContent = currentModule.title;
            
            showQuestion();
            updateProgress();
        }

        // Utility function to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Show current question
        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const container = document.getElementById('questionContainer');
            
            container.innerHTML = `
                <div class="question-slide active">
                    <div class="question-header">
                        <div class="question-number">Câu ${currentQuestionIndex + 1}/${currentQuestions.length}</div>
                        <div class="difficulty-badge">${question.difficulty}</div>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <ul class="options" id="options">
                        ${question.options.map((option, index) => 
                            `<li class="option" onclick="selectAnswer(${index})" data-index="${index}">
                                ${String.fromCharCode(65 + index)}. ${option}
                            </li>`
                        ).join('')}
                    </ul>
                    <div class="explanation" id="explanation">
                        <h4>💡 Giải thích:</h4>
                        <p>${question.explanation}</p>
                    </div>
                </div>
            `;

            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = 
                currentQuestionIndex === currentQuestions.length - 1 ? 'Hoàn thành 🎯' : 'Câu tiếp →';
        }

        // Handle answer selection
        function selectAnswer(selectedIndex) {
            const question = currentQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            const explanation = document.getElementById('explanation');

            // Clear previous selections
            options.forEach(option => {
                option.classList.remove('selected', 'correct', 'incorrect');
            });

            // Mark selected answer
            options[selectedIndex].classList.add('selected');

            // Show correct answer and explanation
            options[question.correct].classList.add('correct');
            if (selectedIndex !== question.correct) {
                options[selectedIndex].classList.add('incorrect');
            }

            // Show explanation
            explanation.classList.add('show');

            // Record answer
            answers[currentQuestionIndex] = {
                selected: selectedIndex,
                correct: question.correct,
                isCorrect: selectedIndex === question.correct
            };

            updateScore();

            // Disable further clicks
            options.forEach(option => {
                option.style.pointerEvents = 'none';
            });
        }

        // Navigation functions
        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
                updateProgress();
                restoreAnswerState();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
                updateProgress();
                restoreAnswerState();
            }
        }

        // Restore answer state when navigating
        function restoreAnswerState() {
            if (answers[currentQuestionIndex]) {
                const answer = answers[currentQuestionIndex];
                const options = document.querySelectorAll('.option');
                const explanation = document.getElementById('explanation');
                
                setTimeout(() => {
                    options[answer.selected].classList.add('selected');
                    options[currentQuestions[currentQuestionIndex].correct].classList.add('correct');
                    if (!answer.isCorrect) {
                        options[answer.selected].classList.add('incorrect');
                    }
                    explanation.classList.add('show');
                    
                    options.forEach(option => {
                        option.style.pointerEvents = 'none';
                    });
                }, 100);
            }
        }

        // Update progress bar
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Câu ${currentQuestionIndex + 1}/${currentQuestions.length}`;
        }

        // Update current score
        function updateScore() {
            const correctAnswers = answers.filter(answer => answer && answer.isCorrect).length;
            const answered = answers.filter(answer => answer).length;
            document.getElementById('currentScore').textContent = `Điểm: ${correctAnswers}/${answered}`;
        }

        // Show results
        function showResults() {
            const correctAnswers = answers.filter(answer => answer && answer.isCorrect).length;
            const percentage = Math.round((correctAnswers / currentQuestions.length) * 100);

            // Update module progress
            const progress = moduleProgress[currentModule.id];
            progress.attempts++;
            progress.score = percentage;
            if (percentage > progress.bestScore) {
                progress.bestScore = percentage;
            }
            if (percentage >= 70) {
                progress.completed = true;
            }
            localStorage.setItem('moduleProgress', JSON.stringify(moduleProgress));

            // Show results screen
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';

            // Set score color based on performance
            const scoreElement = document.getElementById('finalScore');
            scoreElement.textContent = `${correctAnswers}/${currentQuestions.length} (${percentage}%)`;
            
            if (percentage >= 90) {
                scoreElement.className = 'final-score score-excellent';
            } else if (percentage >= 80) {
                scoreElement.className = 'final-score score-good';
            } else if (percentage >= 70) {
                scoreElement.className = 'final-score score-average';
            } else {
                scoreElement.className = 'final-score score-poor';
            }

            // Results summary
            document.getElementById('resultsSummary').innerHTML = `
                <div class="result-card">
                    <h3>${correctAnswers}</h3>
                    <p>Đúng</p>
                </div>
                <div class="result-card">
                    <h3>${currentQuestions.length - correctAnswers}</h3>
                    <p>Sai</p>
                </div>
                <div class="result-card">
                    <h3>${percentage}%</h3>
                    <p>Điểm</p>
                </div>
                <div class="result-card">
                    <h3>${progress.attempts}</h3>
                    <p>Lần thử</p>
                </div>
            `;

            // Performance message
            let message = '';
            if (percentage >= 90) {
                message = '🏆 Xuất sắc! Bạn đã master module này!';
            } else if (percentage >= 80) {
                message = '🎉 Tuyệt vời! Kiến thức vững vàng!';
            } else if (percentage >= 70) {
                message = '👍 Khá tốt! Module hoàn thành!';
            } else if (percentage >= 60) {
                message = '📚 Cần cải thiện. Hãy học thêm và thử lại!';
            } else {
                message = '💪 Đừng nản lòng! Practice makes perfect!';
            }

            document.getElementById('performanceMessage').textContent = message;
            document.getElementById('performanceMessage').className = 
                `performance-message ${scoreElement.className.split(' ')[1]}`;
        }

        // Back to modules
        function backToModules() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('modulesScreen').style.display = 'block';
            renderModules(); // Re-render to show updated progress
        }

        // Retry current module
        function retryModule() {
            if (currentModule) {
                startModule(currentModule.id);
            }
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            renderModules();
        });
    </script>
</body>
