<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Interview Quiz - Complete System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Module Selection Screen */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .module-card:hover {
            transform: translateY(-5px);
        }

        .module-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .module-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .module-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .module-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
        }

        .module-progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .module-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .module-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .status-score {
            color: #666;
        }

        .status-badge {
            color: #667eea;
            font-weight: bold;
        }

        .start-module-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .start-module-btn:hover {
            opacity: 0.9;
        }

        /* Quiz Interface */
        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
            flex-wrap: wrap;
        }

        .quiz-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: bold;
        }

        .quiz-meta {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .current-score {
            font-weight: bold;
            color: #667eea;
            font-size: 0.9rem;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: #666;
            font-size: 0.9rem;
        }

        .question-slide {
            display: none;
        }

        .question-slide.active {
            display: block;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            color: white;
        }

        .question-number {
            font-size: 1rem;
            font-weight: bold;
        }

        .difficulty-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .options {
            list-style: none;
            margin-bottom: 25px;
        }

        .option {
            margin-bottom: 10px;
            padding: 15px 20px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .option.correct {
            border-color: #28a745;
            background: #28a745;
            color: white;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #dc3545;
            color: white;
        }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            border-left: 4px solid #2196f3;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .explanation p {
            color: #555;
            line-height: 1.4;
            font-size: 0.9rem;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            gap: 15px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            max-width: 150px;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Screen */
        .results-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px;
            display: none;
            text-align: center;
        }

        .final-score {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .score-excellent { color: #28a745; }
        .score-good { color: #17a2b8; }
        .score-average { color: #ffc107; }
        .score-poor { color: #dc3545; }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .result-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .result-card h3 {
            color: #667eea;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .result-card p {
            color: #666;
            font-size: 0.8rem;
        }

        .performance-message {
            font-size: 1.1rem;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .restart-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }
            
            .quiz-container, .results-container {
                margin: 10px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .quiz-header {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            
            .quiz-meta {
                justify-content: space-between;
            }
            
            .navigation {
                flex-direction: column;
            }
            
            .nav-btn {
                max-width: none;
            }
            
            .module-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .stat-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Main Header -->
        <div class="header">
            <h1>🤖 Android Interview Quiz</h1>
            <p>Hệ thống học tập Android Development toàn diện</p>
        </div>

        <!-- Modules Selection Screen -->
        <div id="modulesScreen">
            <div class="modules-grid" id="modulesGrid">
                <!-- Modules will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div class="quiz-container" id="quizScreen">
            <div class="quiz-header">
                <div class="quiz-title" id="quizTitle">Module Quiz</div>
                <div class="quiz-meta">
                    <button class="back-btn" onclick="backToModules()">← Quay lại</button>
                    <div class="current-score" id="currentScore">Điểm: 0/0</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Câu 1/20</div>
            </div>

            <div id="questionContainer">
                <!-- Questions will be inserted here -->
            </div>

            <div class="navigation">
                <button class="nav-btn" id="prevBtn" onclick="previousQuestion()" disabled>← Câu trước</button>
                <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp →</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-container" id="resultsScreen">
            <h2>🎉 Kết quả Quiz</h2>
            <div class="final-score" id="finalScore">0/0 (0%)</div>
            <div class="results-summary" id="resultsSummary"></div>
            <div class="performance-message" id="performanceMessage"></div>
            <div>
                <button class="restart-btn" onclick="retryModule()">🔄 Làm lại module</button>
                <button class="restart-btn" onclick="backToModules()">📚 Chọn module khác</button>
            </div>
        </div>
    </div>

    <script>
        // Module definitions
        var modules = {
            kotlin: {
                id: 'kotlin',
                title: 'Kotlin Fundamentals',
                icon: '🎯',
                description: 'Kotlin basics, Coroutines, Flow API, OOP concepts, functions và advanced features',
                questionCount: 20,
                difficulty: 'Beginner to Advanced',
                estimatedTime: '30 phút'
            },
            androidCore: {
                id: 'androidCore',
                title: 'Android Core Components',
                icon: '📱',
                description: 'Activity, Fragment, Intent, BroadcastReceiver, Service lifecycle và best practices',
                questionCount: 18,
                difficulty: 'Intermediate',
                estimatedTime: '25 phút'
            },
            androidUI: {
                id: 'androidUI',
                title: 'Android UI & Views',
                icon: '🎨',
                description: 'RecyclerView, ViewPager, Custom Views, Layouts, Animations và UI optimization',
                questionCount: 15,
                difficulty: 'Intermediate',
                estimatedTime: '20 phút'
            },
            architecture: {
                id: 'architecture',
                title: 'Android Architecture',
                icon: '🏗️',
                description: 'MVVM, MVP, Clean Architecture, ViewModel, LiveData, Repository pattern',
                questionCount: 12,
                difficulty: 'Advanced',
                estimatedTime: '18 phút'
            },
            networking: {
                id: 'networking',
                title: 'Networking & APIs',
                icon: '🌐',
                description: 'Retrofit, OkHttp, REST APIs, GraphQL, caching và error handling',
                questionCount: 12,
                difficulty: 'Intermediate',
                estimatedTime: '18 phút'
            },
            performance: {
                id: 'performance',
                title: 'Performance & Memory',
                icon: '⚡',
                description: 'Memory management, ANR, battery optimization, profiling và best practices',
                questionCount: 10,
                difficulty: 'Advanced',
                estimatedTime: '15 phút'
            }
        };

        // Questions database
        var questionBank = {
            kotlin: [
                {
                    question: "Kotlin Coroutines là gì và tại sao nó hữu ích trong Android development?",
                    options: [
                        "Một thư viện để xử lý UI animations",
                        "Một cách để viết asynchronous code một cách tuần tự và dễ đọc",
                        "Một design pattern cho Android architecture",
                        "Một tool để debug Android applications"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Kotlin Coroutines là concurrency design pattern giúp simplify asynchronous programming. Nó cho phép viết asynchronous code theo cách sequential, making it easier to read và maintain."
                },
                {
                    question: "Sự khác biệt giữa 'launch' và 'async' trong Kotlin Coroutines là gì?",
                    options: [
                        "Không có sự khác biệt nào",
                        "launch trả về Job, async trả về Deferred và có thể return value",
                        "async nhanh hơn launch",
                        "launch chỉ dành cho UI operations"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "launch được sử dụng cho fire-and-forget operations và trả về Job. async được sử dụng khi bạn cần return value và trả về Deferred<T> mà bạn có thể await()."
                },
                {
                    question: "lateinit và lazy trong Kotlin khác nhau như thế nào?",
                    options: [
                        "Không có sự khác biệt",
                        "lateinit cho var, lazy cho val và khởi tạo khi được truy cập lần đầu",
                        "lazy nhanh hơn lateinit",
                        "lateinit chỉ dùng cho primitive types"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "lateinit modifier dùng với var properties và phải được khởi tạo trước khi sử dụng. lazy delegate dùng với val properties và được khởi tạo lazily khi được access lần đầu tiên."
                },
                {
                    question: "Companion object trong Kotlin tương đương với gì trong Java?",
                    options: [
                        "Instance methods",
                        "Static methods và fields",
                        "Interface default methods",
                        "Abstract methods"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Companion object trong Kotlin tương đương với static members trong Java. Members của companion object có thể được access thông qua class name mà không cần tạo instance."
                },
                {
                    question: "Extension functions trong Kotlin có ưu điểm gì?",
                    options: [
                        "Giúp tăng performance",
                        "Cho phép thêm functionality vào existing class mà không cần inheritance",
                        "Chỉ dùng để làm code đẹp hơn",
                        "Thay thế hoàn toàn inheritance"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Extension functions cho phép extend class với new functionality mà không cần modify class đó hay inherit từ nó. Chúng được resolve statically."
                },
                {
                    question: "inline function trong Kotlin được sử dụng để làm gì?",
                    options: [
                        "Để function chạy nhanh hơn",
                        "Compiler sẽ copy function body vào call site để avoid function call overhead",
                        "Để function có thể được call từ Java",
                        "Để function không thể được override"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "inline functions có function body được copy vào call site bởi compiler, giúp eliminate function call overhead. Đặc biệt hữu ích cho higher-order functions."
                },
                {
                    question: "reified keyword trong Kotlin được sử dụng khi nào?",
                    options: [
                        "Với tất cả generic functions",
                        "Với inline functions để preserve type information at runtime",
                        "Để tạo singleton objects",
                        "Với data classes"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "reified keyword chỉ có thể dùng với inline functions và generic type parameters. Nó preserve type information at runtime, cho phép access type T trong function body."
                },
                {
                    question: "Sealed classes trong Kotlin có đặc điểm gì?",
                    options: [
                        "Có thể được inherit từ bất kỳ đâu",
                        "Restrict inheritance và all subclasses phải declare trong cùng file",
                        "Không thể có subclasses",
                        "Chỉ có thể có abstract methods"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Sealed classes restrict inheritance hierarchy. Tất cả direct subclasses phải declare trong same file. Hữu ích cho representing restricted class hierarchies."
                },
                {
                    question: "Scope functions trong Kotlin (let, run, with, apply, also) khác nhau như thế nào?",
                    options: [
                        "Chỉ khác về naming",
                        "Khác về context object (this vs it) và return value",
                        "Khác về performance",
                        "Không có sự khác biệt thực tế"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "Scope functions khác nhau về cách refer đến context object (this vs it) và return value (context object vs lambda result). let/also dùng 'it', run/with/apply dùng 'this'."
                },
                {
                    question: "Data classes trong Kotlin tự động generate những gì?",
                    options: [
                        "Chỉ có constructor",
                        "equals(), hashCode(), toString(), copy(), componentN() functions",
                        "Chỉ có getter và setter",
                        "Chỉ có toString()"
                    ],
                    correct: 1,
                    difficulty: "Beginner",
                    explanation: "Data classes tự động generate equals(), hashCode(), toString(), copy() function và componentN() functions for destructuring based on properties defined in primary constructor."
                },
                {
                    question: "Flow trong Kotlin Coroutines được sử dụng để làm gì?",
                    options: [
                        "Chỉ để handle network requests",
                        "Asynchronously emits multiple values over time (cold stream)",
                        "Thay thế cho LiveData",
                        "Chỉ dùng trong ViewModel"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "Flow là cold asynchronous data stream emits multiple values sequentially. Built on coroutines với backpressure support và rich operators for transformation."
                },
                {
                    question: "StateFlow và SharedFlow khác nhau như thế nào?",
                    options: [
                        "Hoàn toàn giống nhau",
                        "StateFlow always has current value và conflates, SharedFlow có thể replay multiple values",
                        "StateFlow nhanh hơn SharedFlow",
                        "SharedFlow chỉ dùng cho UI"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "StateFlow always has current value, conflates emissions, represents state. SharedFlow có thể replay multiple values, không conflate, suitable for events."
                },
                {
                    question: "Higher-order functions trong Kotlin là gì?",
                    options: [
                        "Functions có priority cao",
                        "Functions nhận functions làm parameters hoặc return functions",
                        "Functions chạy trên background thread",
                        "Functions được optimize bởi compiler"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Higher-order functions là functions nhận một hoặc nhiều functions làm parameters, hoặc return function. Enable functional programming patterns trong Kotlin."
                },
                {
                    question: "Destructuring declarations trong Kotlin hoạt động như thế nào?",
                    options: [
                        "Chỉ work với Arrays",
                        "Uses componentN() functions để extract values from objects",
                        "Chỉ dùng với data classes",
                        "Automatic cho tất cả objects"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Destructuring uses componentN() functions (component1(), component2(), etc.) để extract values. Data classes auto-generate these functions, custom classes có thể implement them."
                },
                {
                    question: "Elvis operator (?:) trong Kotlin được sử dụng khi nào?",
                    options: [
                        "Để check null và provide default value if null",
                        "Để convert types",
                        "Để loop through collections",
                        "Để handle exceptions"
                    ],
                    correct: 0,
                    difficulty: "Beginner",
                    explanation: "Elvis operator (?:) provide default value khi left-hand side expression là null. Syntax: val result = nullableValue ?: defaultValue."
                },
                {
                    question: "Kotlin Collections có những loại nào và khác biệt ra sao?",
                    options: [
                        "Chỉ có List và Map",
                        "Immutable (List, Set, Map) và Mutable (MutableList, MutableSet, MutableMap)",
                        "Tất cả đều mutable",
                        "Chỉ khác về naming"
                    ],
                    correct: 1,
                    difficulty: "Intermediate",
                    explanation: "Kotlin có immutable collections (List, Set, Map) - read-only interfaces và mutable variants (MutableList, MutableSet, MutableMap) cho modification operations."
                },
                {
                    question: "Coroutine Dispatchers trong Kotlin có những loại nào?",
                    options: [
                        "Chỉ có Main và Background",
                        "Main (UI), IO (I/O operations), Default (CPU-intensive), Unconfined",
                        "Tất cả giống nhau",
                        "Chỉ có một loại dispatcher"
                    ],
                    correct: 1,
                    difficulty: "Advanced",
                    explanation: "Dispatchers.Main (UI thread), Dispatchers.IO (I/O operations), Dispatchers.Default (CPU-intensive tasks), Dispatchers.Unconfined (không confined to specific thread)."
                },
                {
                    question: "Coroutine Scope là gì và tại sao quan trọng?",
                    options: [
                        "Chỉ để organize code",
                        "Defines lifetime của coroutines, provides structured concurrency",
                        "Để tăng performance",
                        "Chỉ dùng trong Android"
                    ],

        // Initialize module progress
        var moduleProgress = {};
        
        function initializeModuleProgress() {
            try {
                var saved = localStorage.getItem('moduleProgress');
                moduleProgress = saved ? JSON.parse(saved) : {};
            } catch (e) {
                moduleProgress = {};
            }
            
            Object.keys(modules).forEach(function(moduleId) {
                if (!moduleProgress[moduleId]) {
                    moduleProgress[moduleId] = {
                        completed: false,
                        score: 0,
                        attempts: 0,
                        bestScore: 0
                    };
                }
            });
            
            try {
                localStorage.setItem('moduleProgress', JSON.stringify(moduleProgress));
            } catch (e) {
                // LocalStorage not available, continue without persistence
            }
        }

        // Current quiz state
        var currentModule = null;
        var currentQuestions = [];
        var currentQuestionIndex = 0;
        var answers = [];

        // Render modules grid
        function renderModules() {
            var grid = document.getElementById('modulesGrid');
            var moduleKeys = Object.keys(modules);
            
            var html = '';
            moduleKeys.forEach(function(moduleId) {
                var module = modules[moduleId];
                var progress = moduleProgress[moduleId] || { completed: false, score: 0, attempts: 0, bestScore: 0 };
                var progressPercent = progress.completed ? 100 : (progress.attempts > 0 ? 50 : 0);
                
                var statusText = progress.completed ? '✅ Hoàn thành' : 
                                progress.attempts > 0 ? '🔄 Đang làm' : '🆕 Mới';
                
                var scoreText = progress.attempts > 0 ? 'Điểm cao nhất: ' + progress.bestScore + '%' : 'Chưa thử';
                var buttonText = progress.attempts > 0 ? '🔄 Làm lại' : '🚀 Bắt đầu';
                
                html += '<div class="module-card" onclick="startModule(\'' + moduleId + '\')">';
                html += '<div class="module-icon">' + module.icon + '</div>';
                html += '<div class="module-title">' + module.title + '</div>';
                html += '<div class="module-description">' + module.description + '</div>';
                html += '<div class="module-stats">';
                html += '<div class="stat-item">';
                html += '<span class="stat-number">' + module.questionCount + '</span>';
                html += '<span class="stat-label">Câu hỏi</span>';
                html += '</div>';
                html += '<div class="stat-item">';
                html += '<span class="stat-number">' + module.difficulty + '</span>';
                html += '<span class="stat-label">Độ khó</span>';
                html += '</div>';
                html += '<div class="stat-item">';
                html += '<span class="stat-number">' + module.estimatedTime + '</span>';
                html += '<span class="stat-label">Thời gian</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="module-progress">';
                html += '<div class="module-progress-fill" style="width: ' + progressPercent + '%"></div>';
                html += '</div>';
                html += '<div class="module-status">';
                html += '<span class="status-score">' + scoreText + '</span>';
                html += '<span class="status-badge">' + statusText + '</span>';
                html += '</div>';
                html += '<button class="start-module-btn">' + buttonText + '</button>';
                html += '</div>';
            });
            
            grid.innerHTML = html;
        }

        // Utility function to shuffle array
        function shuffleArray(array) {
            var result = array.slice();
            for (var i = result.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = result[i];
                result[i] = result[j];
                result[j] = temp;
            }
            return result;
        }

        // Start a specific module
        function startModule(moduleId) {
            currentModule = modules[moduleId];
            currentQuestions = questionBank[moduleId] || [];
            
            if (currentQuestions.length === 0) {
                alert('Module này đang được phát triển. Vui lòng chọn module khác!');
                return;
            }
            
            // Shuffle questions for variety
            currentQuestions = shuffleArray(currentQuestions);
            
            currentQuestionIndex = 0;
            answers = [];
            
            document.getElementById('modulesScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            document.getElementById('quizTitle').textContent = currentModule.title;
            
            showQuestion();
            updateProgress();
        }

        // Show current question
        function showQuestion() {
            var question = currentQuestions[currentQuestionIndex];
            var container = document.getElementById('questionContainer');
            
            var optionsHtml = '';
            question.options.forEach(function(option, index) {
                var letter = String.fromCharCode(65 + index);
                optionsHtml += '<li class="option" onclick="selectAnswer(' + index + ')" data-index="' + index + '">';
                optionsHtml += letter + '. ' + option;
                optionsHtml += '</li>';
            });
            
            container.innerHTML = 
                '<div class="question-slide active">' +
                    '<div class="question-header">' +
                        '<div class="question-number">Câu ' + (currentQuestionIndex + 1) + '/' + currentQuestions.length + '</div>' +
                        '<div class="difficulty-badge">' + question.difficulty + '</div>' +
                    '</div>' +
                    '<div class="question-text">' + question.question + '</div>' +
                    '<ul class="options" id="options">' + optionsHtml + '</ul>' +
                    '<div class="explanation" id="explanation">' +
                        '<h4>💡 Giải thích:</h4>' +
                        '<p>' + question.explanation + '</p>' +
                    '</div>' +
                '</div>';

            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = 
                currentQuestionIndex === currentQuestions.length - 1 ? 'Hoàn thành 🎯' : 'Câu tiếp →';
        }

        // Handle answer selection
        function selectAnswer(selectedIndex) {
            var question = currentQuestions[currentQuestionIndex];
            var options = document.querySelectorAll('.option');
            var explanation = document.getElementById('explanation');

            // Clear previous selections
            options.forEach(function(option) {
                option.classList.remove('selected', 'correct', 'incorrect');
            });

            // Mark selected answer
            options[selectedIndex].classList.add('selected');

            // Show correct answer and explanation
            options[question.correct].classList.add('correct');
            if (selectedIndex !== question.correct) {
                options[selectedIndex].classList.add('incorrect');
            }

            // Show explanation
            explanation.classList.add('show');

            // Record answer
            answers[currentQuestionIndex] = {
                selected: selectedIndex,
                correct: question.correct,
                isCorrect: selectedIndex === question.correct
            };

            updateScore();

            // Disable further clicks
            options.forEach(function(option) {
                option.style.pointerEvents = 'none';
            });
        }

        // Navigation functions
        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
                updateProgress();
                restoreAnswerState();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
                updateProgress();
                restoreAnswerState();
            }
        }

        // Restore answer state when navigating
        function restoreAnswerState() {
            var answer = answers[currentQuestionIndex];
            if (answer) {
                setTimeout(function() {
                    var options = document.querySelectorAll('.option');
                    var explanation = document.getElementById('explanation');
                    
                    options[answer.selected].classList.add('selected');
                    options[currentQuestions[currentQuestionIndex].correct].classList.add('correct');
                    if (!answer.isCorrect) {
                        options[answer.selected].classList.add('incorrect');
                    }
                    explanation.classList.add('show');
                    
                    options.forEach(function(option) {
                        option.style.pointerEvents = 'none';
                    });
                }, 100);
            }
        }

        // Update progress bar
        function updateProgress() {
            var progress = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                'Câu ' + (currentQuestionIndex + 1) + '/' + currentQuestions.length;
        }

        // Update current score
        function updateScore() {
            var correctAnswers = answers.filter(function(answer) {
                return answer && answer.isCorrect;
            }).length;
            var answered = answers.filter(function(answer) {
                return answer;
            }).length;
            document.getElementById('currentScore').textContent = 'Điểm: ' + correctAnswers + '/' + answered;
        }

        // Show results
        function showResults() {
            var correctAnswers = answers.filter(function(answer) {
                return answer && answer.isCorrect;
            }).length;
            var percentage = Math.round((correctAnswers / currentQuestions.length) * 100);

            // Update module progress
            var progress = moduleProgress[currentModule.id];
            progress.attempts++;
            progress.score = percentage;
            if (percentage > progress.bestScore) {
                progress.bestScore = percentage;
            }
            if (percentage >= 70) {
                progress.completed = true;
            }
            
            try {
                localStorage.setItem('moduleProgress', JSON.stringify(moduleProgress));
            } catch (e) {
                // LocalStorage not available, continue
            }

            // Show results screen
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';

            // Set score color based on performance
            var scoreElement = document.getElementById('finalScore');
            scoreElement.textContent = correctAnswers + '/' + currentQuestions.length + ' (' + percentage + '%)';
            
            var scoreClass = 'final-score ';
            if (percentage >= 90) {
                scoreClass += 'score-excellent';
            } else if (percentage >= 80) {
                scoreClass += 'score-good';
            } else if (percentage >= 70) {
                scoreClass += 'score-average';
            } else {
                scoreClass += 'score-poor';
            }
            scoreElement.className = scoreClass;

            // Results summary
            document.getElementById('resultsSummary').innerHTML = 
                '<div class="result-card">' +
                    '<h3>' + correctAnswers + '</h3>' +
                    '<p>Đúng</p>' +
                '</div>' +
                '<div class="result-card">' +
                    '<h3>' + (currentQuestions.length - correctAnswers) + '</h3>' +
                    '<p>Sai</p>' +
                '</div>' +
                '<div class="result-card">' +
                    '<h3>' + percentage + '%</h3>' +
                    '<p>Điểm</p>' +
                '</div>' +
                '<div class="result-card">' +
                    '<h3>' + progress.attempts + '</h3>' +
                    '<p>Lần thử</p>' +
                '</div>';

            // Performance message
            var message = '';
            if (percentage >= 90) {
                message = '🏆 Xuất sắc! Bạn đã master module này!';
            } else if (percentage >= 80) {
                message = '🎉 Tuyệt vời! Kiến thức vững vàng!';
            } else if (percentage >= 70) {
                message = '👍 Khá tốt! Module hoàn thành!';
            } else if (percentage >= 60) {
                message = '📚 Cần cải thiện. Hãy học thêm và thử lại!';
            } else {
                message = '💪 Đừng nản lòng! Practice makes perfect!';
            }

            document.getElementById('performanceMessage').textContent = message;
        }

        // Back to modules
        function backToModules() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('modulesScreen').style.display = 'block';
            renderModules(); // Re-render to show updated progress
        }

        // Retry current module
        function retryModule() {
            if (currentModule) {
                startModule(currentModule.id);
            }
        }

        // Initialize app when DOM is ready
        function initApp() {
            initializeModuleProgress();
            renderModules();
        }

        // Start app when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
